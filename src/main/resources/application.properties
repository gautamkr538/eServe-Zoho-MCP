spring.application.name=eServe-Zoho-MCP


# MCP Server SSE Configuration
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=zoho-payroll-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.capabilities.tool=true

# SSE Transport Settings
spring.ai.mcp.server.sse-endpoint=/mcp/sse
spring.ai.mcp.server.sse-message-endpoint=/mcp/messages

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/eserve_zoho_mcp
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=none

#spring.datasource.url=jdbc:postgresql://${PG_DB_IP}/eserve_zoho_mcp
#spring.datasource.username=${PG_DB_USERNAME}
#spring.datasource.password=${PG_DB_PASSWORD}

# Zoho API Configuration
zoho.api.base-url=https://people.zoho.in/people
zoho.api.client-id=${ZOHO_CLIENT_ID}
zoho.api.client-secret=${ZOHO_CLIENT_SECRET}
zoho.api.refresh-token-file=zoho_refresh_token.txt
zoho.api.timeout=30000

# Logging
logging.level.com.zoho.eservemcp.service.ZohoPayrollApiService=INFO
logging.level.org.springframework.web.client.RestTemplate=DEBUG
